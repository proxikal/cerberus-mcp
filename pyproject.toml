[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-context"
version = "2.0.0"
description = "AST-based code exploration with session memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "watchdog>=3.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "numpy>=2.2.6",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-typescript>=0.20.0",
    "tree-sitter-go>=0.20.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "fastmcp>=0.1.0",
    "scikit-learn>=1.0.0",
    "tiktoken>=0.5.0",
    "spacy>=3.0.0",
    "textblob>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "pathspec>=0.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
monitoring = [
    "sentry-sdk>=1.40.0",
]

[project.scripts]
cerberus = "cerberus.cli:main"
cerberus-mcp = "cerberus.mcp:run_server"

[tool.setuptools.package-data]
cerberus = ["*.py"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cerberus*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true  # Ignore third-party library stubs for now
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true  # Don't enforce types in tests initially

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (allow in tests)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
